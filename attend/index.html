<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>출석 체크 · 기합</title>
<meta name="theme-color" content="#16213a">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<script src="../shared/core.js"></script>
<script src="../shared/icons.js"></script>
<script src="../shared/db.js"></script>
<style>
  .att-grid { display: grid; gap: 14px; }
  @media (min-width: 960px) { .att-grid.split { grid-template-columns: 1.3fr 1fr; align-items: start; } }

  /* 번호 키패드 */
  .kiosk { display: grid; gap: 14px; justify-items: center; padding: 22px 16px; }
  .pin-dots { display: flex; gap: 14px; }
  .pin-dots i { width: clamp(46px, 11vw, 70px); aspect-ratio: 1; border-radius: 12px; border: 1.5px solid var(--line); display: grid; place-items: center; font-style: normal; background: var(--bg); }
  .pin-dots i.f { border-color: var(--ink); }
  .pin-dots i.f::after { content: ""; width: 30%; aspect-ratio: 1; border-radius: 50%; background: var(--ink); }
  .pin-dots.shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(100%, 380px); }
  .keypad button { min-height: clamp(64px, 11vh, 86px); border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg-2); font-family: var(--f-num); font-weight: 700; font-size: 2.4rem; cursor: pointer; display: grid; place-items: center; }
  .keypad button:active { transform: scale(.96); background: var(--bg-3); }
  .keypad button.fn { font-family: var(--f-body); font-size: 1rem; font-weight: 700; color: var(--muted); }
  .keypad button.fn .ico { width: 26px; height: 26px; }
  .greet { min-height: 4.2rem; text-align: center; font-family: var(--f-display); font-weight: 800; letter-spacing: -.02em; font-size: clamp(1.6rem, 5vw, 2.6rem); line-height: 1.25; }
  .greet small { display: block; font-size: .5em; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .greet.ok { color: var(--green); animation: pop .35s; }
  .greet.dup { color: var(--ink); }
  .greet.bad { color: var(--red); }
  @keyframes pop { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: none; } }
  .kiosk-title { font-family: var(--f-display); font-weight: 800; letter-spacing: -.02em; font-size: 1.4rem; text-align: center; }

  /* 명단 체크 */
  .names { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .name-btn { min-height: 76px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg-2); font-weight: 800; font-size: 1.1rem; cursor: pointer; display: grid; place-items: center; align-content: center; gap: 2px; padding: 6px; }
  .name-btn small { font-weight: 700; font-size: .78rem; color: var(--muted); }
  .name-btn.on { background: var(--green); border-color: var(--green); color: #fff; }
  .name-btn.on small { color: rgba(255, 255, 255, .85); }

  /* 카메라 */
  .cam { position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: 70vh; background: #000; border-radius: 12px; overflow: hidden; }
  .cam video, .cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .cam.qr video { transform: none; }
  .cam .cam-msg { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px; text-align: center; color: #fff; font-family: var(--f-display); font-weight: 800; letter-spacing: -.02em; font-size: clamp(1.2rem, 3.4vw, 1.9rem); background: linear-gradient(transparent, rgba(0, 0, 0, .75)); }
  .cam .cam-msg.ok { color: #7dffb0; }
  .cam .frame { position: absolute; inset: 18% 22%; border: 2px solid rgba(255, 255, 255, .75); border-radius: 12px; }
  .cam-off { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 10px; color: #fff; text-align: center; padding: 20px; }
  .cam-off .ico { width: 40px; height: 40px; stroke-width: 1.5; opacity: .8; }

  /* 오늘 현황 */
  .today-list { display: grid; gap: 6px; }
  .today-list .it { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: var(--bg-3); }
  .today-list .it .t { font-family: var(--f-num); font-weight: 700; font-size: 1.1rem; }
  .today-list .it b { flex: 1; }

  /* QR 카드 인쇄 */
  #printCards { display: none; }
  @media print {
    body > *:not(#printCards) { display: none !important; }
    #printCards { display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 8mm; padding: 6mm; }
    .qcard { border: 1px dashed #999; border-radius: 4mm; padding: 4mm; text-align: center; break-inside: avoid; font-family: var(--f-body); color: #000; }
    .qcard svg { width: 40mm; height: 40mm; }
    .qcard b { display: block; font-size: 14pt; }
    .qcard span { font-size: 10pt; color: #444; }
  }
</style>
</head>
<body>
<main class="page">
  <nav class="seg" role="tablist" id="tabs">
    <button role="tab" data-t="pin" aria-selected="true"><i data-icon="hash"></i>번호 입력</button>
    <button role="tab" data-t="list"><i data-icon="list-checks"></i>명단 체크</button>
    <button role="tab" data-t="qr"><i data-icon="qr-code"></i>QR 출석</button>
    <button role="tab" data-t="face"><i data-icon="scan-face"></i>얼굴 인식</button>
    <button role="tab" data-t="today"><i data-icon="clipboard-check"></i>오늘 현황</button>
  </nav>

  <section class="tabp" id="t-pin">
    <div class="att-grid split">
      <div class="box kiosk">
        <div class="kiosk-title" id="kTitle">출석번호 4자리를 눌러 주세요</div>
        <div class="pin-dots" id="dots"><i></i><i></i><i></i><i></i></div>
        <div class="greet" id="greet" aria-live="assertive"></div>
        <div class="keypad" id="keypad"></div>
      </div>
      <div class="box"><h2 style="font-size:1.3rem;margin-bottom:8px">방금 출석</h2><div class="today-list" id="recent"></div></div>
    </div>
  </section>

  <section class="tabp" id="t-list" hidden>
    <div class="toolbar"><div class="chips grow" id="lCls"></div><span class="pill" id="lCount"></span></div>
    <div class="names" id="names"></div>
    <p class="hint">이름을 누르면 출석, 다시 누르면 취소됩니다.</p>
  </section>

  <section class="tabp" id="t-qr" hidden>
    <div class="att-grid split">
      <div class="cam qr" id="qrCam"><div class="cam-off" id="qrOff"><i data-icon="camera"></i><span>‘카메라 켜기’를 누르면 시작합니다</span></div><div class="frame"></div><div class="cam-msg" id="qrMsg">QR 카드를 네모 안에 비춰 주세요</div></div>
      <div class="box" style="display:grid;gap:12px;align-content:start">
        <div class="row"><button class="btn primary big" id="qrStart">카메라 켜기</button><button class="btn big" id="qrStop">끄기</button></div>
        <label class="field">카메라<select id="qrDev"></select></label>
        <hr style="border:0;border-top:1px solid var(--line);width:100%">
        <h3 style="font-size:1.2rem">QR 출석 카드 만들기</h3>
        <p class="hint">원생별 QR 카드를 인쇄해 나눠 주세요. 입구 태블릿 카메라에 비추면 출석으로 기록됩니다.</p>
        <button class="btn dark" id="qrPrint"><i data-icon="printer"></i>QR 카드 인쇄</button>
      </div>
    </div>
  </section>

  <section class="tabp" id="t-face" hidden>
    <div class="att-grid split">
      <div class="cam" id="faceCam"><div class="cam-off" id="faceOff"><i data-icon="scan-face"></i><span>처음 시작할 때 인식 모델(약 10MB)을 한 번 내려받습니다</span></div><canvas id="faceCv"></canvas><div class="cam-msg" id="faceMsg">카메라를 바라봐 주세요</div></div>
      <div class="box" style="display:grid;gap:12px;align-content:start">
        <div class="row"><button class="btn primary big" id="faceStart">얼굴 인식 시작</button><button class="btn big" id="faceStop">끄기</button></div>
        <label class="field">카메라<select id="faceDev"></select></label>
        <label class="field">정확도 (높을수록 엄격) <input type="range" id="faceTh" min="0.45" max="0.8" step="0.01"></label>
        <hr style="border:0;border-top:1px solid var(--line);width:100%">
        <h3 style="font-size:1.2rem">얼굴 등록</h3>
        <div class="row"><label class="field" style="flex:1">원생<select id="faceWho"></select></label><button class="btn dark" id="faceReg"><i data-icon="camera"></i>등록 (3장)</button></div>
        <p class="hint" id="faceInfo"></p>
        <p class="hint">얼굴 정보는 사진이 아닌 특징값(숫자)으로만 이 기기에 저장됩니다. 사진이나 화면 속 얼굴은 인식하지 않습니다. 사용 전 보호자 동의를 받아 주세요.</p>
      </div>
    </div>
  </section>

  <section class="tabp" id="t-today" hidden></section>
</main>
<div id="printCards"></div>
<script src="attend.js"></script>
</body>
</html>

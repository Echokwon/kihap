<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기합 — 도장 수업 도구</title>
<meta name="description" content="태권도장 수업 도구 · 도장 운영 · 운동 게임 · 대회를 한 곳에서">
<meta name="theme-color" content="#16213a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기합">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="shared/base.css">
<script src="shared/core.js"></script>
<style>
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 64px; }
  .hero { padding: 2.2rem 0 1.6rem; display: grid; gap: .7rem; }
  .hero h1 { font-size: clamp(2.1rem, 6vw, 3.4rem); }
  .hero h1 em { font-style: normal; color: var(--red); }
  .hero p { margin: 0; color: var(--muted); font-size: 1.05rem; max-width: 38rem; }
  .resume { justify-self: start; }
  .resume[hidden] { display: none; }

  .sec { margin-top: 2.2rem; }
  .sec-head { display: flex; align-items: baseline; gap: .7rem; margin-bottom: .9rem; flex-wrap: wrap; }
  .sec-head h2 { font-size: 1.7rem; }
  .sec-head .tag { font-size: .8rem; font-weight: 700; padding: .15em .7em; border-radius: 999px; background: var(--bg-3); color: var(--muted); }
  .sec-head .tag.live { background: var(--red); color: #fff; }

  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .tile {
    position: relative; display: grid; gap: .5rem; align-content: start;
    padding: 1.1rem 1rem 1rem; min-height: 132px; text-decoration: none;
    background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    transition: transform .12s, border-color .12s;
  }
  a.tile:hover { transform: translateY(-3px); border-color: var(--red); }
  a.tile:active { transform: scale(.98); }
  .tile .ic { font-size: 2rem; line-height: 1; }
  .tile b { font-size: 1.1rem; }
  .tile span { font-size: .85rem; color: var(--muted); line-height: 1.45; }
  .tile.soon { opacity: .62; }
  .tile.soon::after {
    content: '준비 중'; position: absolute; top: .7rem; right: .7rem;
    font-size: .7rem; font-weight: 700; padding: .1em .6em; border-radius: 999px; background: var(--bg-3); color: var(--muted);
  }
  .tile .stripe { position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 0 4px 4px 0; }

  footer { margin-top: 3rem; padding-top: 1.2rem; border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted); display: flex; gap: 1rem; flex-wrap: wrap; justify-content: space-between; }
  #installBtn[hidden] { display: none; }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand grow" href="./" aria-label="기합 홈"><span id="logo"></span>기합</a>
  <button class="btn" id="installBtn" hidden>앱으로 설치</button>
  <button class="btn icon" id="muteBtn" aria-label="소리 끄기/켜기">🔊</button>
  <button class="btn icon" id="themeBtn" aria-label="밝게/어둡게">🌙</button>
</header>

<main class="wrap">
  <section class="hero">
    <h1>수업은 <em>기합</em>으로 시작해요</h1>
    <p>타이머·게임·출석·대회 도구를 버튼 하나로 꺼내 쓰세요. TV나 태블릿에 띄워 두면 수업이 훨씬 편해져요. 인터넷이 끊겨도 동작해요.</p>
    <a class="btn primary resume" id="resume" hidden href="#">이어서 쓰기 →</a>
  </section>

  <section class="sec" aria-labelledby="h-tools">
    <div class="sec-head"><h2 id="h-tools">수업 도구</h2><span class="tag live">바로 사용</span></div>
    <div class="grid" id="tools"></div>
  </section>

  <section class="sec" aria-labelledby="h-ops">
    <div class="sec-head"><h2 id="h-ops">도장 운영</h2><span class="tag live">바로 사용</span></div>
    <div class="grid" id="ops"></div>
  </section>

  <section class="sec" aria-labelledby="h-games">
    <div class="sec-head"><h2 id="h-games">운동 게임</h2><span class="tag live">바로 사용</span></div>
    <div class="grid" id="games"></div>
  </section>

  <section class="sec" aria-labelledby="h-comp">
    <div class="sec-head"><h2 id="h-comp">대회</h2><span class="tag live">바로 사용</span></div>
    <div class="grid" id="comp"></div>
  </section>

  <footer>
    <span>기합 · 도장 수업 도구</span>
    <span>데이터는 이 기기에만 저장돼요</span>
  </footer>
</main>

<script>
(function () {
  const K = Kihap, $ = id => document.getElementById(id);
  $('logo').innerHTML = K.logo;

  const TOOLS = [
    ['timer', '⏲️', '타이머', '정해진 시간 카운트다운', '#d8323c'],
    ['interval', '🔁', '인터벌', '운동·휴식 라운드 반복', '#e8a500'],
    ['stopwatch', '⏱️', '스톱워치', '기록 재기 · 랩 타임', '#2457c5'],
    ['dice', '🎲', '주사위', '숫자 · 운동 주사위', '#18995a'],
    ['draw', '🎯', '랜덤 뽑기', '이름 뽑기 · 팀 나누기', '#8a3ffc'],
    ['bracket', '🏆', '토너먼트', '대진표 만들고 우승자까지', '#e8a500'],
    ['signal', '🚥', '반응 신호', '색·방향 신호로 순발력', '#18995a'],
    ['bomb', '💣', '폭탄 돌리기', '언제 터질지 모르는 폭탄', '#d8323c']
  ];
  const OPS = [['attend', '📋', '출석 체크', '번호·명단·QR·얼굴로 출석', '#18995a'], ['manage', '🧒', '원생 관리', '명단 · 회비 · 띠 · 출석 현황', '#2457c5'], ['planner', '🗓️', '월간 계획표', '수업 계획 · 이미지 저장', '#e8a500'], ['bus', '🚐', '차량 운행표', '정류장 · 탑승 체크', '#d8323c']];
  const GAMES = [['tower/', '🗼', '탑 오르기', '미션 깨며 한 층씩 · 팀 대결', '#8a3ffc'], ['dodgeball/', '🔴', '스킬 피구', '스킬 카드로 뒤집는 피구', '#d8323c'], ['run/', '🏃', '모션 달리기', '카메라가 몸동작을 인식', '#18995a'], ['charades/', '🎭', '몸으로 말해요', '팀 대항 제시어 맞히기', '#e8a500'], ['ladder/', '🐍', '운동 사다리', '주사위 · 사다리 · 운동 미션', '#2457c5']];
  const COMP = [['scoreboard/', '📊', '스코어보드', '겨루기 점수판 · 라운드 타이머', '#2457c5'], ['poomsae/', '🥋', '품새 채점', '공인 품새 · 심판 1~5명', '#d8323c'], ['poomsae/?mode=free', '🎵', '자유 품새', '기술 · 표현 채점', '#8a3ffc']];

  const tile = (href, ic, name, desc, color) =>
    `<a class="tile" href="${href}"><i class="stripe" style="background:${color}"></i><span class="ic" aria-hidden="true">${ic}</span><b>${name}</b><span>${desc}</span></a>`;
  const soon = ([ic, name, desc]) =>
    `<div class="tile soon" aria-disabled="true"><span class="ic" aria-hidden="true">${ic}</span><b>${name}</b><span>${desc}</span></div>`;

  $('tools').innerHTML = TOOLS.map(([id, ic, n, d, c]) => tile('tools/#' + id, ic, n, d, c)).join('');
  $('ops').innerHTML = OPS.map(([id, ic, n, d, c]) => tile(id + '/', ic, n, d, c)).join('');
  $('games').innerHTML = GAMES.map(([h, ic, n, d, c]) => tile(h, ic, n, d, c)).join('');
  $('comp').innerHTML = COMP.map(([h, ic, n, d, c]) => tile(h, ic, n, d, c)).join('');

  // 이어서 쓰기
  const last = K.get('last', null);
  const t = last && TOOLS.find(x => x[0] === last.id), o = last && OPS.find(x => x[0] === last.id);
  const g = last && GAMES.concat(COMP).find(x => x[0].replace(/\/.*$/, '') === last.id);
  if (t || o || g) { const r = $('resume'); r.hidden = false; r.href = t ? 'tools/#' + t[0] : o ? o[0] + '/' : g[0]; r.textContent = `이어서: ${t ? t[2] : o ? o[2] : g[2]} →`; }

  // 소리 · 테마
  const syncBtns = () => { $('muteBtn').textContent = K.muted() ? '🔇' : '🔊'; $('themeBtn').textContent = K.isDark() ? '☀️' : '🌙'; };
  $('muteBtn').onclick = () => { K.setMuted(!K.muted()); syncBtns(); K.toast(K.muted() ? '소리 꺼짐' : '소리 켜짐'); };
  $('themeBtn').onclick = () => { K.toggleTheme(); syncBtns(); };
  syncBtns();

  // 앱 설치 (안드로이드·크롬)
  let deferred = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('installBtn').hidden = false; });
  $('installBtn').onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $('installBtn').hidden = true; };
})();
</script>
</body>
</html>

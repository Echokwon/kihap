<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기합 — 도장 수업 도구</title>
<meta name="description" content="태권도장 수업 도구 · 도장 운영 · 운동 게임 · 대회를 한 곳에서">
<meta name="theme-color" content="#16213a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기합">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="shared/base.css">
<script src="shared/core.js"></script>
<script src="shared/icons.js"></script>
<style>
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 64px; }

  .hero { padding: 2.6rem 0 1.4rem; display: grid; gap: .9rem; border-bottom: 1px solid var(--line); }
  .hero .eyebrow { font-family: var(--f-num); font-weight: 700; letter-spacing: .14em; font-size: .95rem; color: var(--red); }
  .hero h1 { font-size: clamp(2rem, 5.4vw, 3.3rem); letter-spacing: -.035em; line-height: 1.12; }
  .hero p { margin: 0; color: var(--muted); font-size: 1.02rem; max-width: 36rem; }
  .hero-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .resume { gap: .5em; }

  .sec { margin-top: 2.4rem; }
  .sec-head { display: flex; align-items: baseline; gap: .8rem; margin-bottom: .9rem; }
  .sec-head .no { font-family: var(--f-num); font-weight: 700; font-size: 1.05rem; color: var(--sc); letter-spacing: .06em; }
  .sec-head h2 { font-size: 1.35rem; }
  .sec-head .cnt { margin-left: auto; font-size: .85rem; color: var(--muted); font-weight: 600; }

  .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .tile {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
    padding: 14px 14px 14px 14px; min-height: 76px; text-decoration: none;
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px;
    transition: border-color .12s, background .12s;
  }
  .tile:hover { border-color: var(--sc); }
  .tile:active { background: var(--bg-3); }
  .tile .ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--sc) 13%, transparent); color: var(--sc); }
  .tile .ic .ico { width: 23px; height: 23px; }
  .tile b { display: block; font-size: 1.05rem; font-weight: 700; letter-spacing: -.02em; }
  .tile small { display: block; font-size: .84rem; color: var(--muted); line-height: 1.4; margin-top: 1px; }
  .tile .go { color: var(--muted); opacity: .6; }

  .brand { font-family: var(--f-display); font-weight: 800; letter-spacing: -.03em; font-size: 1.35rem; }
  footer { margin-top: 3rem; padding-top: 1.2rem; border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted); display: flex; gap: 1rem; flex-wrap: wrap; justify-content: space-between; }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand grow" href="./" aria-label="기합 홈"><span id="logo"></span>기합</a>
  <button class="btn" id="installBtn" hidden><i data-icon="download"></i>앱으로 설치</button>
  <button class="btn icon" id="muteBtn" aria-label="소리 끄기/켜기"></button>
  <button class="btn icon" id="themeBtn" aria-label="밝게/어둡게"></button>
</header>

<main class="wrap">
  <section class="hero">
    <span class="eyebrow">KIHAP · DOJANG TOOLKIT</span>
    <h1>도장 수업에 필요한 도구,<br>한곳에 모았습니다.</h1>
    <p>타이머와 게임, 출석과 대회 채점까지. TV나 태블릿에 띄워 두고 쓰세요. 한 번 열어 두면 인터넷이 끊겨도 동작합니다.</p>
    <div class="hero-row"><a class="btn primary resume" id="resume" hidden href="#"></a></div>
  </section>

  <div id="sections"></div>

  <footer>
    <span>기합 · 도장 수업 도구</span>
    <span>기록은 이 기기에만 저장됩니다</span>
  </footer>
</main>

<script>
(function () {
  const K = Kihap, $ = id => document.getElementById(id), I = K.icon;
  $('logo').innerHTML = K.logo;

  // [주소, 아이콘, 이름, 설명, 마지막 사용 id]
  const SECTIONS = [
    { title: '수업 도구', color: '#d8323c', items: [
      ['tools/#timer', 'timer', '타이머', '정해 둔 시간 카운트다운', 'timer'],
      ['tools/#interval', 'repeat', '인터벌', '운동과 휴식을 라운드로 반복', 'interval'],
      ['tools/#stopwatch', 'alarm-clock', '스톱워치', '기록 측정과 구간 기록', 'stopwatch'],
      ['tools/#dice', 'dices', '주사위', '숫자 주사위와 운동 주사위', 'dice'],
      ['tools/#draw', 'shuffle', '랜덤 뽑기', '이름 뽑기와 팀 나누기', 'draw'],
      ['tools/#bracket', 'trophy', '토너먼트', '대진표를 만들고 우승자까지', 'bracket'],
      ['tools/#signal', 'traffic-cone', '반응 신호', '색과 방향 신호로 순발력 훈련', 'signal'],
      ['tools/#bomb', 'bomb', '폭탄 돌리기', '언제 터질지 모르는 시간 게임', 'bomb'] ] },
    { title: '도장 운영', color: '#2457c5', items: [
      ['attend/', 'clipboard-check', '출석 체크', '번호 · 명단 · QR · 얼굴 인식', 'attend'],
      ['manage/', 'users', '원생 관리', '명단 · 회비 · 띠 · 출석 현황', 'manage'],
      ['planner/', 'calendar-days', '월간 계획표', '수업 계획 작성과 이미지 저장', 'planner'],
      ['bus/', 'bus', '차량 운행표', '정류장 순서와 탑승 확인', 'bus'] ] },
    { title: '운동 게임', color: '#18995a', items: [
      ['tower/', 'castle', '탑 오르기', '층마다 운동 미션, 팀 대결', 'tower'],
      ['dodgeball/', 'volleyball', '스킬 피구', '스킬 카드를 더한 피구', 'dodgeball'],
      ['run/', 'footprints', '모션 달리기', '카메라가 제자리 달리기를 인식', 'run'],
      ['charades/', 'drama', '몸으로 말해요', '팀 대항 제시어 맞히기', 'charades'],
      ['ladder/', 'ladder', '운동 사다리', '주사위 보드게임과 운동 미션', 'ladder'] ] },
    { title: '대회', color: '#8a3ffc', items: [
      ['scoreboard/', 'chart-column', '스코어보드', '겨루기 점수판과 라운드 타이머', 'scoreboard'],
      ['poomsae/', 'belt', '공인 품새 채점', '정확성 · 표현성, 심판 1~5명', 'poomsae'],
      ['poomsae/?mode=free', 'music', '자유 품새 채점', '기술 · 표현 항목 채점', 'poomsae-free'] ] }
  ];

  $('sections').innerHTML = SECTIONS.map((s, i) => `
    <section class="sec" style="--sc:${s.color}" aria-labelledby="h${i}">
      <div class="sec-head"><span class="no">0${i + 1}</span><h2 id="h${i}">${s.title}</h2><span class="cnt">${s.items.length}개</span></div>
      <div class="grid">${s.items.map(([href, ic, name, desc]) => `
        <a class="tile" href="${href}"><span class="ic">${I(ic)}</span><span><b>${name}</b><small>${desc}</small></span><span class="go">${I('chevron-right')}</span></a>`).join('')}
      </div>
    </section>`).join('');

  // 이어서 쓰기
  const last = K.get('last', null);
  const hit = last && SECTIONS.flatMap(s => s.items).find(x => x[4] === last.id);
  if (hit) { const r = $('resume'); r.hidden = false; r.href = hit[0]; r.innerHTML = `${I(hit[1])}이어서: ${hit[2]}`; }

  // 소리 · 테마
  const syncBtns = () => { $('muteBtn').innerHTML = I(K.muted() ? 'volume-x' : 'volume-2'); $('themeBtn').innerHTML = I(K.isDark() ? 'sun' : 'moon'); };
  $('muteBtn').onclick = () => { K.setMuted(!K.muted()); syncBtns(); K.toast(K.muted() ? '소리를 껐습니다' : '소리를 켰습니다'); if (!K.muted()) K.sound.pop(); };
  $('themeBtn').onclick = () => { K.toggleTheme(); syncBtns(); };
  syncBtns();

  // 앱 설치 (안드로이드·크롬)
  let deferred = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('installBtn').hidden = false; });
  $('installBtn').onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $('installBtn').hidden = true; };
})();
</script>
</body>
</html>

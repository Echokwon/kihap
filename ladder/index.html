<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>운동 사다리 · 기합</title>
<meta name="theme-color" content="#16213a">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<script src="../shared/core.js"></script>
<script src="../shared/icons.js"></script>
<style>
  .setup { display: grid; gap: 14px; max-width: 720px; }
  .game { display: grid; gap: 16px; }
  @media (min-width: 980px) { .game { grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); align-items: start; } }
  .game:fullscreen { background: var(--bg); padding: 20px; overflow: auto; }

  .board { position: relative; aspect-ratio: 6 / 5; width: 100%; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(5, 1fr); gap: 4px; padding: 4px; border-radius: 12px; background: var(--navy); }
  .cell { position: relative; border-radius: 6px; background: var(--bg-2); display: grid; place-items: center; align-content: center; font-weight: 900; overflow: hidden; }
  .cell:nth-child(odd) { background: var(--bg-3); }
  .cell .n { position: absolute; top: 3px; left: 6px; font-family: var(--f-num); font-weight: 700; font-size: clamp(.8rem, 1.8vw, 1.15rem); color: var(--muted); }
  .cell .ic { line-height: 1; color: var(--ink); opacity: .75; }
  .cell .ic .ico { width: clamp(18px, 3.6vw, 34px); height: clamp(18px, 3.6vw, 34px); }
  .cell.goal .ic { color: #fff; opacity: 1; }
  .cell.mission { background: color-mix(in srgb, var(--yellow) 28%, var(--bg-2)); }
  .cell.star { background: color-mix(in srgb, var(--green) 24%, var(--bg-2)); }
  .cell.goal { background: var(--red); color: #fff; }
  .cell.goal .n { color: #fff; }
  .lines { position: absolute; inset: 4px; width: calc(100% - 8px); height: calc(100% - 8px); pointer-events: none; }
  .tokens { position: absolute; inset: 4px; pointer-events: none; }
  .tok { position: absolute; width: 7%; aspect-ratio: 1; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 4px rgba(0,0,0,.35); display: grid; place-items: center; color: #fff; font-family: var(--f-num); font-weight: 700; font-size: clamp(.7rem, 1.6vw, 1.1rem); transition: left .25s, top .25s; transform: translate(-50%, -50%); }

  .side { display: grid; gap: 12px; }
  .teams { display: grid; gap: 8px; }
  .tm { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg-2); border: 1.5px solid var(--line); font-weight: 800; }
  .tm i { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .tm span { margin-left: auto; color: var(--muted); font-family: var(--f-num); font-weight: 700; font-size: 1.2rem; }
  .tm.now { border-color: var(--tc); box-shadow: inset 4px 0 0 var(--tc); }
  .roll { display: grid; gap: 10px; justify-items: center; padding: 16px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); text-align: center; }
  .die { width: 112px; aspect-ratio: 1; border-radius: 16px; background: #fff; color: #16213a; border: 3px solid #16213a; box-shadow: 0 4px 0 #16213a; display: grid; place-items: center; font-family: var(--f-num); font-weight: 700; font-size: 4.6rem; line-height: 1; }
  .die.spin { animation: spin .45s ease-out; }
  @keyframes spin { 40% { transform: rotate(-14deg) translateY(-6px); } 70% { transform: rotate(8deg); } }
  .msg { font-family: var(--f-display); font-weight: 800; letter-spacing: -.02em; font-size: clamp(1.4rem, 3.4vw, 2.2rem); line-height: 1.25; min-height: 2.5em; word-break: keep-all; }
  .msg .ico { color: var(--muted); margin-right: .25em; }
  .msg small { display: block; font-family: var(--f-body); font-size: .5em; color: var(--muted); font-weight: 700; }
  .roll .btn.big { width: 100%; }
</style>
</head>
<body>
<main class="page">
  <section class="box setup" id="setup">
    <h2 style="font-size:1.6rem;display:flex;align-items:center;gap:.5rem"><i data-icon="ladder"></i>운동 사다리</h2>
    <p class="hint" style="font-size:1rem">주사위를 굴려 30칸에 먼저 도착한 팀이 이깁니다. 사다리 칸은 위로, 미끄럼틀 칸은 아래로 이동합니다. 아령 칸에서는 운동 미션을, 별 칸에서는 한 번 더 굴립니다.</p>
    <div class="field">팀 수<div class="chips" id="nt"><button class="chip on" data-v="2">2팀</button><button class="chip" data-v="3">3팀</button><button class="chip" data-v="4">4팀</button></div></div>
    <label class="field">미션 목록 (한 줄에 하나)<textarea id="missions" class="search" style="min-height:160px;padding:.7em;line-height:1.6"></textarea></label>
    <label class="check"><input type="checkbox" id="failBack" checked> 미션 실패하면 2칸 뒤로</label>
    <button class="btn primary big" id="start"><i data-icon="play"></i>시작</button>
  </section>

  <section id="play" hidden>
    <div class="toolbar" style="margin-bottom:12px"><button class="btn" id="back"><i data-icon="settings"></i>설정</button><span class="grow"></span><button class="btn" id="fs"><i data-icon="maximize"></i>전체 화면</button></div>
    <div class="game" id="game">
      <div class="board" id="board"></div>
      <div class="side">
        <div class="roll"><div class="die" id="die">?</div><div class="msg" id="msg"></div><div id="acts" style="display:grid;gap:8px;width:100%"></div></div>
        <div class="teams" id="teams"></div>
      </div>
    </div>
  </section>
</main>
<script>
(function () {
  const K = Kihap, $ = id => document.getElementById(id), esc = K.esc, I = K.icon;
  K.topbar('운동 사다리', '', 'ladder');
  K.markLast('ladder', '운동 사다리');

  const N = 30, COLS = 6, ROWS = 5;
  const LADDERS = { 3: 11, 7: 15, 14: 23, 19: 27 };
  const SLIDES = { 17: 6, 22: 13, 26: 18, 29: 21 };
  const MISSION = [5, 9, 12, 16, 20, 24, 28];
  const STAR = [10, 25];
  const DEF = '스쿼트 10회\n팔굽혀펴기 5회\n점핑잭 15회\n앞차기 양발 10회씩\n플랭크 15초\n제자리 뛰기 20초\n버피 3회\n기마 자세 15초\n돌려차기 양발 5회씩\n개구리 점프 5회';
  const COLORS = [['#d8323c', '빨강팀'], ['#2457c5', '파랑팀'], ['#18995a', '초록팀'], ['#e8a500', '노랑팀']];

  const cfg = K.get('lad:cfg', { nt: 2, missions: DEF, failBack: true });
  $('missions').value = cfg.missions; $('failBack').checked = cfg.failBack;
  document.querySelectorAll('#nt .chip').forEach(c => c.classList.toggle('on', +c.dataset.v === cfg.nt));
  $('nt').onclick = e => { const c = e.target.closest('.chip'); if (c) document.querySelectorAll('#nt .chip').forEach(x => x.classList.toggle('on', x === c)); };

  // 칸 번호를 판 위 위치로 (아래 줄부터 지그재그)
  function pos(n) {
    const i = n - 1, rFromBottom = Math.floor(i / COLS), inRow = i % COLS;
    const col = rFromBottom % 2 === 0 ? inRow : COLS - 1 - inRow, row = ROWS - 1 - rFromBottom;
    return { row, col, x: (col + .5) / COLS * 100, y: (row + .5) / ROWS * 100 };
  }
  function drawBoard() {
    const cells = Array(N);
    for (let n = 1; n <= N; n++) {
      const p = pos(n);
      let cls = '', ic = '';
      if (LADDERS[n]) { ic = I('ladder'); } else if (SLIDES[n]) { ic = I('chevron-down'); } else if (MISSION.includes(n)) { cls = 'mission'; ic = I('dumbbell'); } else if (STAR.includes(n)) { cls = 'star'; ic = I('star'); }
      if (n === N) { cls = 'goal'; ic = I('flag'); }
      cells[p.row * COLS + p.col] = `<div class="cell ${cls}"><span class="n">${n}</span><span class="ic">${ic}</span></div>`;
    }
    const line = (a, b, color, dash) => { const p = pos(+a), q = pos(b); return `<line x1="${p.x * 6}" y1="${p.y * 5}" x2="${q.x * 6}" y2="${q.y * 5}" stroke="${color}" stroke-width="9" stroke-linecap="round" ${dash ? 'stroke-dasharray="2 16"' : ''} opacity=".75"/>`; };
    $('board').innerHTML = cells.join('') + `<svg class="lines" viewBox="0 0 600 500" preserveAspectRatio="none" aria-hidden="true">
      ${Object.entries(LADDERS).map(([a, b]) => line(a, b, '#18995a', true)).join('')}${Object.entries(SLIDES).map(([a, b]) => line(a, b, '#d8323c', false)).join('')}</svg><div class="tokens" id="tokens"></div>`;
  }

  let G = null, busy = false;
  $('start').onclick = () => {
    const missions = $('missions').value.split('\n').map(s => s.trim()).filter(Boolean);
    const nt = +document.querySelector('#nt .chip.on').dataset.v;
    Object.assign(cfg, { nt, missions: $('missions').value, failBack: $('failBack').checked }); K.set('lad:cfg', cfg);
    G = { missions: missions.length ? missions : DEF.split('\n'), turn: 0, phase: 'roll', over: false,
      teams: COLORS.slice(0, nt).map(([c, n]) => ({ color: c, name: n, at: 1 })) };
    $('setup').hidden = true; $('play').hidden = false; drawBoard(); render(); say(`${G.teams[0].name}부터 시작`, '주사위를 굴리세요');
  };
  $('back').onclick = () => { $('play').hidden = true; $('setup').hidden = false; };
  $('fs').onclick = () => K.fullscreen($('game'));

  const say = (m, sub, ic) => $('msg').innerHTML = (ic ? I(ic) : '') + esc(m) + (sub ? `<small>${esc(sub)}</small>` : '');
  const team = () => G.teams[G.turn];
  function render() {
    // 같은 칸에 여럿이면 살짝 비켜서
    const at = {}; $('tokens').innerHTML = G.teams.map((t, i) => { const p = pos(t.at), k = at[t.at] = (at[t.at] || 0) + 1, off = (k - 1) * 2.4;
      return `<div class="tok" style="background:${t.color};left:${p.x + off}%;top:${p.y - off}%">${i + 1}</div>`; }).join('');
    $('teams').innerHTML = G.teams.map((t, i) => `<div class="tm ${i === G.turn && !G.over ? 'now' : ''}" style="--tc:${t.color}"><i style="background:${t.color}"></i>${t.name}<span>${t.at}칸</span></div>`).join('');
    const T = team();
    $('acts').innerHTML = G.over ? `<button class="btn big" data-a="again">${I('rotate-ccw')}다시 하기</button>`
      : G.phase === 'mission' ? `<button class="btn primary big" data-a="done" style="background:var(--green);border-color:var(--green)">${I('check')}미션 성공</button><button class="btn" data-a="fail">${I('x')}실패${cfg.failBack ? ' · 2칸 뒤로' : ''}</button>`
      : `<button class="btn primary big" data-a="roll" style="background:${T.color};border-color:${T.color}" ${busy ? 'disabled' : ''}>${I('dices')}${T.name} 주사위 굴리기</button>`;
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function move(t, to) { const step = to > t.at ? 1 : -1; while (t.at !== to) { t.at += step; render(); K.sound.tick(); await wait(220); } }

  async function roll() {
    if (busy) return; busy = true; render();
    const t = team(), d = $('die');
    K.sound.roll(); d.classList.remove('spin'); void d.offsetWidth; d.classList.add('spin');
    for (let i = 0; i < 6; i++) { d.textContent = K.randInt(1, 6); await wait(70); }
    const n = K.randInt(1, 6); d.textContent = n; say(`${t.name} ${n}칸`);
    await wait(400);
    await move(t, Math.min(N, t.at + n));
    await land(t);
    busy = false; render();
  }
  async function land(t) {
    if (t.at >= N) { G.over = true; say(`${t.name} 도착 · 승리`, '', 'trophy'); K.sound.end(); setTimeout(() => K.sound.fanfare(), 900); return; }
    if (LADDERS[t.at]) { say('사다리 — 위로 올라갑니다', `${t.at}칸에서 ${LADDERS[t.at]}칸으로`, 'ladder'); K.sound.fanfare(); await wait(600); await move(t, LADDERS[t.at]); return next(); }
    if (SLIDES[t.at]) { say('미끄럼틀 — 아래로 내려갑니다', `${t.at}칸에서 ${SLIDES[t.at]}칸으로`, 'chevron-down'); K.sound.boom(); await wait(600); await move(t, SLIDES[t.at]); return next(); }
    if (MISSION.includes(t.at)) { G.phase = 'mission'; const m = G.missions[K.randInt(0, G.missions.length - 1)]; say(`미션: ${m}`, `${t.name} 모두 함께`, 'dumbbell'); K.sound.whistle(); return; }
    if (STAR.includes(t.at)) { say('한 번 더', `${t.name} 다시 굴리세요`, 'star'); K.sound.pop(); return; }
    next();
  }
  function next() { G.turn = (G.turn + 1) % G.teams.length; G.phase = 'roll'; const t = team(); setTimeout(() => { if (!G.over && !busy) say(`${t.name} 차례`, '주사위를 굴리세요'); }, 900); }

  $('acts').addEventListener('click', async e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a, t = team();
    if (a === 'roll') roll();
    else if (a === 'again') $('start').click();
    else if (a === 'done') { K.sound.pop(); say('미션 성공', '', 'check'); next(); render(); }
    else if (a === 'fail') { G.phase = 'roll'; busy = true; render(); if (cfg.failBack) await move(t, Math.max(1, t.at - 2)); busy = false; next(); render(); }
  });
})();
</script>
</body>
</html>

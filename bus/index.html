<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>차량 운행표 · 기합</title>
<meta name="theme-color" content="#16213a">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<script src="../shared/core.js"></script>
<script src="../shared/icons.js"></script>
<script src="../shared/db.js"></script>
<style>
  .stops { display: grid; gap: 10px; counter-reset: st; }
  .stop { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 12px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); }
  .stop-n { counter-increment: st; width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-family: var(--f-num); font-weight: 700; font-size: 1.4rem; }
  .stop-n::before { content: counter(st); }
  .stop-body { display: grid; gap: 8px; min-width: 0; }
  .stop-head { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .stop-head input { min-height: 42px; padding: 0 .7em; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); font-weight: 700; }
  .stop-head input.nm { flex: 1 1 160px; min-width: 0; }
  .kids { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .kid { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px 4px 10px; border-radius: 8px; background: var(--bg-3); font-weight: 700; }
  .kid button { border: 0; background: transparent; cursor: pointer; color: var(--muted); padding: 0 2px; display: inline-grid; place-items: center; }
  .kid button .ico { width: 16px; height: 16px; }
  .kid.away { background: color-mix(in srgb, var(--yellow) 25%, transparent); }
  .kids select { min-height: 36px; border-radius: 8px; border: 1.5px dashed var(--line); background: transparent; padding: 0 .6em; font-weight: 700; color: var(--muted); }

  /* 운행 모드 */
  .drive .stop { grid-template-columns: auto 1fr; }
  .drive .stop.done { opacity: .55; }
  .drive .stop-n { width: 48px; height: 48px; font-size: 1.5rem; }
  .drive h3 { font-size: 1.5rem; }
  .ride { min-height: 60px; padding: 0 1.1em; border-radius: 12px; border: 1.5px solid var(--line); display: inline-flex; align-items: center; gap: .4em; background: var(--bg); font-weight: 800; font-size: 1.15rem; cursor: pointer; }
  .ride.on { background: var(--green); border-color: var(--green); color: #fff; }
  .ride.away { border-style: dashed; color: var(--muted); }
  .progress { height: 8px; border-radius: 99px; background: var(--bg-3); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--green); transition: width .2s; }

  @media print {
    .stop { break-inside: avoid; border: 1px solid #999; }
    .stop-head input { border: 0; padding: 0; }
    .kid button, .kids select, .stop .btn { display: none !important; }
  }
</style>
</head>
<body>
<main class="page">
  <div class="toolbar no-print">
    <div class="seg grow" id="routes" role="tablist"></div>
    <button class="btn" id="addRoute"><i data-icon="plus"></i>운행 추가</button>
  </div>
  <div id="view"></div>
</main>
<script src="bus.js"></script>
</body>
</html>

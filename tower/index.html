<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>탑 오르기 · 기합</title>
<meta name="theme-color" content="#16213a">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<script src="../shared/core.js"></script>
<script src="../shared/icons.js"></script>
<style>
  .setup { display: grid; gap: 14px; max-width: 720px; }
  .setup h2 { font-size: 1.6rem; display: flex; align-items: center; gap: .5rem; }
  .arena { display: grid; gap: 14px; }
  .arena.two { grid-template-columns: 1fr 1fr; }
  @media (max-width: 760px) { .arena.two { grid-template-columns: 1fr; } }
  .side { display: grid; grid-template-columns: minmax(90px, 150px) 1fr; gap: 14px; align-items: stretch; padding: 14px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); }
  .side h2 { grid-column: 1 / -1; font-size: 1.5rem; display: flex; gap: .55rem; align-items: center; }
  .side h2 .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--tc); flex: none; }
  .side h2 .fl { margin-left: auto; font-family: var(--f-num); font-weight: 700; font-size: 1.6rem; color: var(--muted); letter-spacing: 0; }
  .side h2 .fl small { font-family: var(--f-body); font-size: .55em; font-weight: 700; margin-left: 2px; }

  .tower { display: flex; flex-direction: column-reverse; gap: 3px; padding: 6px; border-radius: 10px; background: var(--bg-3); min-height: 360px; position: relative; }
  .floor { flex: 1; min-height: 14px; border-radius: 4px; background: var(--bg-2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 4px; font-family: var(--f-num); font-weight: 700; font-size: .85rem; color: var(--muted); transition: background .3s; position: relative; }
  .floor.boss { border-color: var(--yellow); border-width: 2px; }
  .floor.done { background: var(--tc); border-color: var(--tc); color: #fff; }
  .floor.here { outline: 2px solid var(--ink); outline-offset: 1px; color: var(--ink); }
  .floor .ico { width: 14px; height: 14px; }
  .floor.top .ico { color: var(--yellow); }
  .floor.done.top .ico { color: #fff; }

  .mission { display: grid; gap: 12px; align-content: center; text-align: center; padding: 12px; border-radius: 10px; }
  .m-tag { justify-self: center; display: inline-flex; align-items: center; gap: .35em; font-weight: 800; font-size: .9rem; padding: .25em .8em; border-radius: 6px; background: var(--bg-3); color: var(--muted); }
  .m-tag.boss { background: var(--yellow); color: #1b1300; }
  .m-ic { color: var(--tc); line-height: 1; }
  .m-ic .ico { width: clamp(56px, 8vw, 88px); height: clamp(56px, 8vw, 88px); stroke-width: 1.6; }
  .m-text { font-family: var(--f-display); font-weight: 800; letter-spacing: -.02em; font-size: clamp(1.9rem, 5vw, 3.3rem); line-height: 1.15; word-break: keep-all; }
  .m-timer { font-family: var(--f-num); font-weight: 700; font-size: 2.6rem; color: var(--red); min-height: 1.2em; line-height: 1.1; }
  .m-timer small { font-family: var(--f-body); font-size: .5em; font-weight: 700; color: var(--muted); }
  .m-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .m-btns .ok { flex: 1 1 100%; min-height: 68px; font-size: 1.3rem; }
  .side.win { border-color: var(--tc); box-shadow: inset 0 0 0 2px var(--tc); }
  .side.win .mission { background: var(--tc); color: #fff; }
  .side.win .m-ic { color: #fff; }
  .arena:fullscreen { background: var(--bg); padding: 20px; overflow: auto; }
</style>
</head>
<body>
<main class="page">
  <section class="box setup" id="setup">
    <h2><i data-icon="castle"></i>탑 오르기</h2>
    <p class="hint" style="font-size:1rem">층마다 나오는 운동 미션을 해내면 한 층씩 올라갑니다. 5층마다 보스 미션이 있고, 꼭대기에 먼저 오른 팀이 이깁니다.</p>
    <div class="field">방식<div class="chips" id="sMode"><button class="chip on" data-v="1">반 전체 (탑 1개)</button><button class="chip" data-v="2">팀 대결 (탑 2개)</button></div></div>
    <div class="field">높이<div class="chips" id="sFloors"><button class="chip" data-v="5">5층</button><button class="chip on" data-v="10">10층</button><button class="chip" data-v="15">15층</button><button class="chip" data-v="20">20층</button></div></div>
    <div class="field">난이도<div class="chips" id="sLevel"><button class="chip" data-v="0.6">쉬움 (유치부)</button><button class="chip on" data-v="1">보통</button><button class="chip" data-v="1.5">어려움</button></div></div>
    <div class="grid2"><label class="field">팀 1 이름<input id="sT1" value="청룡팀"></label><label class="field">팀 2 이름<input id="sT2" value="백호팀"></label></div>
    <details><summary style="cursor:pointer;font-weight:700">미션 목록 고치기</summary>
      <p class="hint">한 줄에 하나: <b>운동 이름 | 기본 횟수 | 단위</b> — 단위가 ‘초’이면 타이머 버튼이 생깁니다.</p>
      <textarea id="sMissions" class="search" style="min-height:220px;padding:.8em;line-height:1.6"></textarea>
      <button class="btn sm" id="sDefault" style="margin-top:6px">기본 목록으로</button>
    </details>
    <button class="btn primary big" id="start"><i data-icon="play"></i>시작</button>
  </section>

  <section id="play" hidden>
    <div class="toolbar no-print" style="margin-bottom:12px">
      <button class="btn" id="back"><i data-icon="settings"></i>설정</button><span class="grow"></span>
      <button class="btn" id="fs"><i data-icon="maximize"></i>전체 화면</button>
    </div>
    <div class="arena" id="arena"></div>
  </section>
</main>
<script>
(function () {
  const K = Kihap, $ = id => document.getElementById(id), esc = K.esc, I = K.icon;
  K.topbar('탑 오르기', '', 'castle');
  K.markLast('tower', '탑 오르기');

  const DEF = `스쿼트 | 15 | 회
팔굽혀펴기 | 10 | 회
점핑잭 | 20 | 회
앞차기 (양발) | 20 | 회
돌려차기 (양발) | 16 | 회
개구리 점프 | 8 | 회
플랭크 | 20 | 초
제자리 뛰기 | 20 | 초
꽃게 걸음 왕복 | 2 | 번
기마 자세 버티기 | 20 | 초
버피 | 5 | 회
지르기 (기합 크게) | 20 | 회
곰 걸음 왕복 | 2 | 번
무릎 높이 뛰기 | 15 | 회`;
  const BOSS = [['flame', '버피 {a}회 + 점핑잭 {b}회', 6, 25], ['zap', '스쿼트 {a}회 + 앞차기 {b}회', 20, 20], ['mountain', '플랭크 {a}초 + 팔굽혀펴기 {b}회', 30, 10], ['siren', '기마 자세 {a}초 + 지르기 {b}회', 30, 30]];
  const COLORS = ['#2457c5', '#d8323c'];
  // 운동 이름으로 아이콘 고르기
  const iconFor = (name, unit) => /차기/.test(name) ? 'kick' : /점프|뛰기|잭/.test(name) ? 'footprints' : /걸음|왕복/.test(name) ? 'route'
    : unit === '초' ? 'timer' : /지르기/.test(name) ? 'hand' : 'dumbbell';
  // 예전 형식(그림 | 이름 | 횟수 | 단위)이면 첫 칸을 빼서 보여 줌
  const migrate = txt => String(txt || '').split('\n').map(l => { const p = l.split('|'); return p.length >= 4 ? p.slice(1).map(s => s.trim()).join(' | ') : l; }).join('\n');

  const cfg = K.get('tower:cfg', { mode: 1, floors: 10, level: 1, t1: '청룡팀', t2: '백호팀', missions: DEF });
  $('sMissions').value = migrate(cfg.missions) || DEF;
  $('sT1').value = cfg.t1; $('sT2').value = cfg.t2;
  const pick = (id, v) => document.querySelectorAll(`#${id} .chip`).forEach(c => c.classList.toggle('on', c.dataset.v === String(v)));
  pick('sMode', cfg.mode); pick('sFloors', cfg.floors); pick('sLevel', cfg.level);
  ['sMode', 'sFloors', 'sLevel'].forEach(id => $(id).onclick = e => { const c = e.target.closest('.chip'); if (c) pick(id, c.dataset.v); });
  $('sDefault').onclick = () => $('sMissions').value = DEF;
  const val = id => document.querySelector(`#${id} .chip.on`).dataset.v;

  let G = null;
  const parse = () => migrate($('sMissions').value).split('\n').map(l => l.split('|').map(s => s.trim())).filter(p => p[0])
    .map(([name, n, unit]) => ({ name, n: Number(n) || 10, unit: unit || '회', ic: iconFor(name, unit || '회') }));

  function newMission(team) {
    const f = team.floor + 1, isBoss = f % 5 === 0 || f === G.floors;
    const L = G.level, r = n => Math.max(1, Math.round(n * L));
    if (isBoss) {
      const b = BOSS[K.randInt(0, BOSS.length - 1)];
      return { boss: true, ic: b[0], text: b[1].replace('{a}', r(b[2])).replace('{b}', r(b[3])), secs: 0 };
    }
    let m; do { m = G.missions[K.randInt(0, G.missions.length - 1)]; } while (G.missions.length > 1 && team.last === m.name && Math.random() < .9);
    team.last = m.name;
    const n = r(m.n);
    return { ic: m.ic, text: `${m.name} ${n}${m.unit}`, secs: m.unit === '초' ? n : 0 };
  }

  $('start').onclick = () => {
    const missions = parse(); if (!missions.length) { K.toast('미션이 하나 이상 있어야 합니다'); return; }
    const mode = +val('sMode');
    Object.assign(cfg, { mode, floors: +val('sFloors'), level: +val('sLevel'), t1: $('sT1').value.trim() || '청룡팀', t2: $('sT2').value.trim() || '백호팀', missions: $('sMissions').value });
    K.set('tower:cfg', cfg);
    G = { floors: cfg.floors, level: cfg.level, missions, over: false,
      teams: (mode === 2 ? [cfg.t1, cfg.t2] : ['우리 반']).map((name, i) => ({ name, floor: 0, color: COLORS[i], m: null, timer: null, left: 0 })) };
    G.teams.forEach(t => t.m = newMission(t));
    $('setup').hidden = true; $('play').hidden = false; K._wantAwake = true; K.keepAwake(true);
    render(); K.sound.whistle();
  };
  $('back').onclick = () => { if (G) G.teams.forEach(t => clearInterval(t.timer)); $('play').hidden = true; $('setup').hidden = false; };
  $('fs').onclick = () => K.fullscreen($('arena'));

  function render() {
    $('arena').className = 'arena' + (G.teams.length === 2 ? ' two' : '');
    $('arena').innerHTML = G.teams.map((t, i) => {
      const floors = Array.from({ length: G.floors }, (_, k) => { const f = k + 1, top = f === G.floors, here = f === t.floor + 1 && !t.won;
        return `<div class="floor ${f % 5 === 0 || top ? 'boss' : ''} ${f <= t.floor ? 'done' : ''} ${top ? 'top' : ''} ${here ? 'here' : ''}">${here ? I('person-standing') : ''}${f}${top ? I('crown') : ''}</div>`; }).join('');
      const m = t.m;
      return `<div class="side ${t.won ? 'win' : ''}" style="--tc:${t.color}" data-i="${i}">
        <h2><span class="dot"></span>${esc(t.name)}<span class="fl">${t.floor}<small>/ ${G.floors}층</small></span></h2>
        <div class="tower">${floors}</div>
        <div class="mission">${t.won ? `<div class="m-ic">${I('trophy')}</div><div class="m-text">${esc(t.name)}<br>꼭대기 도착</div><div class="m-btns"><button class="btn big" data-a="again">${I('rotate-ccw')}다시 하기</button></div>` : `
          <span class="m-tag ${m.boss ? 'boss' : ''}">${m.boss ? I('siren') + '보스 층' : (t.floor + 1) + '층 미션'}</span>
          <div class="m-ic">${I(m.ic)}</div>
          <div class="m-text">${esc(m.text)}</div>
          <div class="m-timer" id="tm${i}">${m.secs && t.timer ? t.left + '<small>초</small>' : ''}</div>
          <div class="m-btns">
            <button class="btn primary ok" data-a="ok" ${G.over ? 'disabled' : ''}>${I('check')}성공 — 한 층 올라가기</button>
            ${m.secs ? `<button class="btn" data-a="timer">${I('timer')}${m.secs}초 재기</button>` : ''}
            <button class="btn" data-a="swap">${I('shuffle')}다른 미션</button>
            <button class="btn" data-a="down" ${t.floor ? '' : 'disabled'}>${I('undo-2')}한 층 내리기</button>
          </div>`}</div></div>`;
    }).join('');
  }

  $('arena').addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const i = +b.closest('.side').dataset.i, t = G.teams[i], a = b.dataset.a;
    if (a === 'again') { $('start').click(); return; }
    clearInterval(t.timer); t.timer = null;
    if (a === 'ok') {
      t.floor++;
      if (t.floor >= G.floors) { t.won = true; G.over = true; K.sound.end(); setTimeout(() => K.sound.fanfare(), 900); }
      else { t.m = newMission(t); t.m.boss ? K.sound.boom() : K.sound.pop(); }
    } else if (a === 'swap') { t.m = newMission(t); K.sound.tick(); }
    else if (a === 'down') { t.floor = Math.max(0, t.floor - 1); t.m = newMission(t); }
    else if (a === 'timer') {
      t.left = t.m.secs; K.sound.go();
      t.timer = setInterval(() => {
        t.left--; const el = $('tm' + i); if (el) el.innerHTML = t.left > 0 ? t.left + '<small>초</small>' : '<small>시간 끝 — 성공 버튼을 누르세요</small>';
        if (t.left <= 3 && t.left > 0) K.sound.beep();
        if (t.left <= 0) { clearInterval(t.timer); t.timer = null; K.sound.end(); }
      }, 1000);
    }
    render();
  });
})();
</script>
</body>
</html>
